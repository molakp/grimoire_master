name: Feature request
description: Suggest an idea or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: rules
    attributes:
      label: Dungeon World rules reference
      description: If the feature is about game rules, point to the relevant move or page.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
