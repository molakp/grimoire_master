name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a bug! Please fill in as much as you can. Never paste passwords, tokens, or other personal data.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the character sheet
        2. Click on ...
        3. See the error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Character creation
        - Character sheet
        - Dice roller
        - Community
        - Admin / master area
        - Login / account
        - Other
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome 130 on Android
  - type: textarea
    id: logs
    attributes:
      label: Screenshots or console errors
      render: shell
