name: Deploy to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never run two production deploys at the same time.
concurrency:
  group: deploy-production
  cancel-in-progress: false

defaults:
  run:
    working-directory: grimoire-master_code

jobs:
  deploy:
    name: Deploy Firestore rules and Hosting
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.VITE_FIREBASE_PROJECT_ID }}.web.app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: grimoire-master_code/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:rules

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_FIRESTORE_DB_ID: ${{ vars.VITE_FIREBASE_FIRESTORE_DB_ID }}

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy
        run: npx firebase deploy --only firestore:rules,hosting --project "${{ vars.VITE_FIREBASE_PROJECT_ID }}" --non-interactive
